services:
    mysql:
        container_name: "mysql"
        image: ${NAMESPACE}_mysql:latest
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${MYSQL_PORT:-3306}:3306"
        # only what MySQL reads - the first start creates this database and user
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-default}
            MYSQL_USER: ${MYSQL_USER:-mysites}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysites}
            MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        command: ["mysqld", "--user=mysql", "--sql-mode=${SQL_MODE:-ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION}"]
        volumes:
            - ./conf/my.cnf:/etc/my.cnf
            # storage/plugins/mysql/ is created by the IDE ("storage": true in composer.json)
            - ${IDE_ROOT}/storage/plugins/mysql/data:/var/lib/mysql
        networks:
            my-sites-ide:
                # sites reach it as mysql; db is kept for anything written when the container was called db
                aliases:
                    - db
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-proot"]
            retries: 3
            timeout: 5s

    # started by `ide:spark` alongside APP (autostart: true in composer.json)
